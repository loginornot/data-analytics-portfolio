name: Verify Iowa liquor portfolio refresh

on:
  push:
    branches:
      - iowa-liquor-refresh

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Inspect Iowa Data Hub CSV and schema downloads
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          base = 'https://data.iowa.gov/api/dataset-download?path='
          paths = [
              'datasets/1252/columns.json',
              'datasets/1252/rows.csv',
          ]

          for path in paths:
              print(f'=== {path} ===')
              headers = {
                  'User-Agent': 'Mozilla/5.0',
                  'Referer': 'https://data.iowa.gov/catalog/dataset/1252',
              }
              if path.endswith('rows.csv'):
                  headers['Range'] = 'bytes=0-8191'
              req = urllib.request.Request(base + urllib.parse.quote(path, safe=''), headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      sample = response.read(8192)
                      print('status:', response.status)
                      print('final_url:', response.geturl())
                      print('content-type:', response.headers.get('content-type'))
                      print('content-length:', response.headers.get('content-length'))
                      print('content-range:', response.headers.get('content-range'))
                      print('content-disposition:', response.headers.get('content-disposition'))
                      print(sample.decode('utf-8', 'replace'))
              except urllib.error.HTTPError as exc:
                  print('status:', exc.code)
                  print('body:', exc.read(4096).decode('utf-8', 'replace'))
          PY
