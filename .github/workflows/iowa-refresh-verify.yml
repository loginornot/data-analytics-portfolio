name: Verify Iowa liquor portfolio refresh

on:
  push:
    branches:
      - iowa-liquor-refresh

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check annual historical cost-field samples
        run: |
          python - <<'PY'
          import csv
          import io
          import urllib.request
          import urllib.parse

          base = 'https://data.iowa.gov/api/dataset-download?path='
          datasets = {
              2012: 1249,
              2013: 1250,
              2014: 1251,
              2015: 1252,
              2016: 1253,
              2017: 1254,
          }

          for year, dataset_id in datasets.items():
              path = f'datasets/{dataset_id}/rows.csv'
              url = base + urllib.parse.quote(path, safe='')
              req = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': 'Mozilla/5.0',
                      'Referer': f'https://data.iowa.gov/catalog/dataset/{dataset_id}',
                  },
              )
              print(f'=== {year} / dataset {dataset_id} ===')
              with urllib.request.urlopen(req, timeout=45) as response:
                  sample = response.read(65536)
                  print('content-disposition:', response.headers.get('content-disposition'))

              marker = sample.find(b'invoice_id,')
              if marker < 0:
                  print('Could not locate CSV header in initial ZIP bytes')
                  continue

              text = sample[marker:].decode('utf-8', 'replace')
              reader = csv.DictReader(io.StringIO(text))
              rows = []
              for row in reader:
                  if len(rows) >= 25:
                      break
                  rows.append(row)

              nonempty_cost = sum(bool((r.get('state_bottle_cost') or '').strip()) for r in rows)
              nonempty_retail = sum(bool((r.get('state_bottle_retail') or '').strip()) for r in rows)
              print('sample_rows:', len(rows))
              print('nonempty_state_bottle_cost:', nonempty_cost)
              print('nonempty_state_bottle_retail:', nonempty_retail)
              for row in rows[:3]:
                  print({
                      'date': row.get('ordered_on'),
                      'store': row.get('store_name'),
                      'item': row.get('item_no'),
                      'cost': row.get('state_bottle_cost'),
                      'retail': row.get('state_bottle_retail'),
                      'bottles': row.get('sales_bottles'),
                      'dollars': row.get('sales_dollars'),
                  })
          PY
